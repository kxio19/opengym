# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
limit_req_zone $binary_remote_addr zone=opengym_api:10m rate=10r/s;
server {
    listen 80;
    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend container
    # API routes always win over the static-file regexes below. Social photos deliberately use
    # .jpg/.png URLs, but they are private resources and must reach the authenticated API rather
    # than being looked up in the public web root.
    location ^~ /api/ {
        limit_req zone=opengym_api burst=30 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public presentation for friends. Keep it outside the SPA fallback and always
    # revalidate it so copy and screenshots can be updated without stale caches.
    location = /amigos {
        absolute_redirect off;
        return 301 /amigos/;
    }
    location ^~ /amigos/ {
        try_files $uri $uri/ /amigos/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Las capturas no llevan hash en el nombre, asi que no pueden ser immutable:
    # si se sustituye una, el nombre sigue siendo el mismo. Una hora de frescura
    # evita revalidar cinco imagenes en cada visita, y stale-while-revalidate deja
    # que un cambio se propague en segundo plano sin que nadie espere por el.
    location ^~ /amigos/amigos-assets/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite assets are content-hashed: their URLs change with their contents, so they
    # can be cached permanently without hiding a new deployment.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry points are stable URLs and must revalidate so clients discover new hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
